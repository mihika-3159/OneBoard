name: OneBoard Windows clean install and startup

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AUTH_SECRET_KEY: "windows-ci-only-signing-key-not-for-production-0123456789abcdef"
      DATABASE_URL: "sqlite:///./oneboard_windows_ci.sqlite3"
      ONEBOARD_DEMO_MODE: "false"
      ONEBOARD_PRODUCTION_MODE: "false"
      ONEBOARD_TEST_DISPOSABLE_STARTUP: "1"
      OLLAMA_BASE_URL: "http://127.0.0.1:19999"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies in fresh runner
        run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock'
      - name: TypeScript production build on Windows
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Create fresh disposable SQLite schema with Alembic
        run: python -m alembic upgrade head
      - name: Financial and tenant budget tests on Windows
        run: python -m pytest -q tests/adversarial/test_financial_evidence_reconciliation.py tests/adversarial/test_tenant_resource_budget.py
      - name: Fresh localhost API startup and two-tenant HTTP acceptance
        run: |
          python scripts/windows_startup_smoke.py > windows-smoke.json
          python scripts/production_acceptance.py --smoke-report windows-smoke.json --out windows-acceptance.json
          python -c "import json; a=json.load(open('windows-acceptance.json')); assert a['production_level_3']=='NO_GO'; assert a['windows_installation']['clean_startup']=='passed'"
      - name: Archive disposable Windows startup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oneboard-windows-startup
          path: |
            windows-smoke.json
            windows-acceptance.json
          if-no-files-found: ignore
          retention-days: 14

  native-nvda:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      AUTH_SECRET_KEY: "windows-ci-only-signing-key-not-for-production-0123456789abcdef"
      DATABASE_URL: "sqlite:///./oneboard_nvda_ci.sqlite3"
      ONEBOARD_DEMO_MODE: "false"
      ONEBOARD_PRODUCTION_MODE: "false"
      CORS_ORIGINS: "http://127.0.0.1:4173"
      OLLAMA_BASE_URL: "http://127.0.0.1:19999"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock'
      - name: Install isolated native screen-reader test tooling
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @guidepup/guidepup@0.40.0 @guidepup/setup@0.29.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install @guidepup/setup setup --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install @guidepup/setup install nvda
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
      - name: Run actual NVDA speech assertions (no simulated fallback)
        working-directory: apps/web
        run: npx --no-install playwright test --config playwright.nvda.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-nvda-speech
          path: |
            apps/web/nvda-speech.json
            apps/web/test-results/
          if-no-files-found: warn
