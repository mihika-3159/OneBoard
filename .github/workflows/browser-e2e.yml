name: OneBoard browser E2E
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      AUTH_SECRET_KEY: "e2e-test-secret-only-0123456789abcdef0123456789abcdef"
      ONEBOARD_DEMO_MODE: "false"
      ACCOUNT_SECURITY_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      CORS_ORIGINS: "http://127.0.0.1:4173"
      DATABASE_URL: "sqlite:///./oneboard_browser_e2e.sqlite3"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock'
      - name: Install browser test tooling
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          bash ../../scripts/install_browser_tools.sh
          npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: Run real browser E2E tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: browser-required.json
          ONEBOARD_TEST_BROWSER: ${{ matrix.browser }}
        run: |
          npx playwright test --config playwright.config.ts --reporter=line,json
          python ../../scripts/require_browser_suite.py browser-required.json 29
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            apps/web/test-results/
            apps/web/browser-required.json
          retention-days: 7
