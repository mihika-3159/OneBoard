name: OneBoard browser E2E
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/p0-auth-tenant-isolation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET_KEY: "e2e-test-secret-only-0123456789abcdef0123456789abcdef"
      ONEBOARD_DEMO_MODE: "false"
      DATABASE_URL: "sqlite:///./oneboard_browser_e2e.sqlite3"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Install browser test tooling
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Run real browser E2E tests
        working-directory: apps/web
        run: npx playwright test --config playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
