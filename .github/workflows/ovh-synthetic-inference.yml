name: OneBoard OVH synthetic inference probe
# Deliberately manual-only: do not consume anonymous third-party quota
# during unrelated PR updates. This is a synthetic vendor evaluation, not a
# production dependency or release certification.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Probe anonymous OVH endpoint with synthetic scenarios only
        run: python experiments/ovh-ai/synthetic_probe.py
      - name: Upload synthetic response observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ovh-synthetic-inference-observations
          path: test-results/ovh-anonymous-synthetic.json
          if-no-files-found: warn
          retention-days: 7
