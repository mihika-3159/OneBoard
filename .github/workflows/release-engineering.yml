name: OneBoard Batch P release engineering
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET_KEY: "batch-p-disposable-test-signing-key-not-production"
      DATABASE_URL: "sqlite:///./oneboard_batch_p.sqlite3"
      ONEBOARD_DEMO_MODE: "false"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock'
      - run: python -m scripts.release_checks lock
      - run: python -m scripts.release_checks sbom python-sbom.json
      - name: Mandatory high severity backend security analysis
        run: python -m bandit -r apps/api -lll -f json -o bandit.json
      - name: Critical coverage and generated properties
        run: |
          python -m pip install --no-deps coverage==7.10.7
          python -m coverage run --branch --source=apps.api -m pytest -q tests/unit tests/adversarial --junitxml=critical-tests.xml
          python -m coverage json -o coverage.json
          python -m scripts.release_checks coverage coverage.json
          python -m pytest -q tests/adversarial/test_batch_p_properties.py --junitxml=property-tests.xml
      - name: Locked frontend build, security analysis and SBOM
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          node scripts/static-security.mjs ../../frontend-static.json
          npm sbom --sbom-format cyclonedx --package-lock-only > ../../node-sbom.json
          npm run build
      - run: python -m scripts.release_checks manifest apps/web/dist build-integrity.json
      - run: python -m scripts.release_checks bundle apps/web/dist frontend-budget.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-static-evidence
          path: |
            coverage.json
            critical-tests.xml
            property-tests.xml
            python-sbom.json
            node-sbom.json
            bandit.json
            frontend-static.json
            build-integrity.json
            frontend-budget.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-web-build
          path: apps/web/dist/
          if-no-files-found: error
  production-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oneboard_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: oneboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oneboard_ci -d oneboard_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET_KEY: "batch-p-disposable-test-signing-key-not-production"
      DATABASE_URL: "postgresql+psycopg://oneboard_ci:disposable-ci-only@127.0.0.1:5432/oneboard_ci"
      ONEBOARD_CI_PRODUCTION_BROWSER: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-web-build
          path: apps/web/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-static-evidence
          path: release-evidence
      - run: python -m scripts.release_checks verify apps/web/dist release-evidence/build-integrity.json
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock'
      - run: python -m alembic upgrade head
      - working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          bash ../../scripts/install_browser_tools.sh
          npx --no-install playwright install --with-deps chromium
      - run: python -m scripts.verify_production_browser
      - name: Require real browser and DAST reports
        run: test -s apps/web/production-browser.json && test -s dynamic-security.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-production-browser
          path: |
            apps/web/production-browser.json
            dynamic-security.json
          if-no-files-found: error
  release-receipt:
    runs-on: ubuntu-latest
    needs: [static-and-build, production-browser]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-static-evidence
          path: evidence/static
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-production-browser
          path: evidence/browser
      - run: python -m scripts.release_checks aggregate evidence release-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-engineering-receipt
          path: release-receipt.json
          if-no-files-found: error

  candidate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: release-receipt
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-engineering-receipt
          path: evidence
      - name: Consolidate exact source-revision workflow evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m scripts.candidate_evidence --receipt evidence/release-receipt.json --output candidate-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-acceptance
          path: candidate-acceptance.json
          if-no-files-found: error
