name: OneBoard verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET_KEY: "ci-only-test-secret-not-for-production-0123456789abcdef"
      ONEBOARD_DEMO_MODE: "false"
      DATABASE_URL: "sqlite:///./oneboard_ci.sqlite3"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Python syntax
        run: python -m compileall -q apps/api tests alembic
      - name: Unit, adversarial, and integration tests
        run: python -m pytest -v
      - name: Alembic migration smoke test (disposable SQLite)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: TypeScript and production build
        run: npm run build

  ollama-live:
    name: Real Ollama inference (small CPU model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      ONEBOARD_CI_OLLAMA_MODEL: "qwen2.5:0.5b"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/oneboard-ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/oneboard-ollama.log
          exit 1
      - name: Pull small real inference model
        run: ollama pull "$ONEBOARD_CI_OLLAMA_MODEL"
      - name: Run real inference and fallback smoke tests
        run: python -m pytest -q tests/test_ollama_live_ci.py
      - name: Ollama diagnostics on failure
        if: failure()
        run: |
          ollama list || true
          tail -n 100 /tmp/oneboard-ollama.log || true
