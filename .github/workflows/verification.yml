name: OneBoard verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET_KEY: "ci-only-test-secret-not-for-production-0123456789abcdef"
      ONEBOARD_DEMO_MODE: "false"
      DATABASE_URL: "sqlite:///./oneboard_ci.sqlite3"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Python syntax
        run: python -m compileall -q apps/api tests alembic
      - name: Unit, adversarial, and integration tests
        run: python -m pytest -v
      - name: Alembic migration smoke test (disposable SQLite)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: TypeScript and production build
        run: npm run build

  ollama-live:
    name: Real Ollama inference (small CPU model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      ONEBOARD_CI_OLLAMA_MODEL: "qwen2.5:0.5b"
      ONEBOARD_LIVE_OLLAMA_TESTS: "1"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/oneboard-ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/oneboard-ollama.log
          exit 1
      - name: Pull small real inference model
        run: ollama pull "$ONEBOARD_CI_OLLAMA_MODEL"
      - name: Run real inference and fallback smoke tests
        run: python -m pytest -q tests/test_ollama_live_ci.py
      - name: Ollama diagnostics on failure
        if: failure()
        run: |
          ollama list || true
          tail -n 100 /tmp/oneboard-ollama.log || true

  postgres-security:
    name: PostgreSQL migration and shared throttle concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oneboard_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: oneboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oneboard_ci -d oneboard_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET_KEY: "ci-only-test-secret-not-for-production-0123456789abcdef"
      ONEBOARD_DEMO_MODE: "false"
      PYTHONPATH: "."
      DATABASE_URL: "postgresql+psycopg://oneboard_ci:disposable-ci-only@127.0.0.1:5432/oneboard_ci"
      ONEBOARD_TEST_POSTGRES_URL: "postgresql+psycopg://oneboard_ci:disposable-ci-only@127.0.0.1:5432/oneboard_ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Run disposable PostgreSQL migration and concurrency tests
        run: python -m pytest -v tests/integration/test_postgres_security.py
      - name: Verify full PostgreSQL logical backup and restore in disposable CI
        env:
          ONEBOARD_CI_DISPOSABLE_RESTORE: "1"
        run: |
          if ! command -v pg_dump >/dev/null || ! command -v pg_restore >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          python scripts/verify_postgres_restore.py
