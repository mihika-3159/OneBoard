name: OneBoard verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/p0-auth-tenant-isolation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET_KEY: "ci-only-test-secret-not-for-production-0123456789abcdef"
      ONEBOARD_DEMO_MODE: "false"
      DATABASE_URL: "sqlite:///./oneboard_ci.sqlite3"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Python syntax
        run: python -m compileall -q apps/api tests alembic
      - name: Unit, adversarial, and integration tests
        run: python -m pytest -v
      - name: Alembic migration smoke test (disposable SQLite)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: TypeScript and production build
        run: npm run build
