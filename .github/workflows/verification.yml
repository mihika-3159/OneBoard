name: OneBoard verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET_KEY: "ci-only-test-secret-not-for-production-0123456789abcdef"
      ONEBOARD_DEMO_MODE: "false"
      DATABASE_URL: "sqlite:///./oneboard_ci.sqlite3"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock'
      - name: Python syntax
        run: python -m compileall -q apps/api tests alembic
      - name: Unit, adversarial, and integration tests
        run: python -m pytest -v
      - name: Alembic migration smoke test (disposable SQLite)
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: TypeScript and production build
        run: npm run build

  ollama-live:
    name: Mandatory full local Ollama and authenticated live API
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: "."
      ONEBOARD_CI_OLLAMA_MODEL: "qwen2.5:0.5b"
      OLLAMA_MAX_OUTPUT_TOKENS: "192"
      OLLAMA_MAX_JSON_OUTPUT_TOKENS: "256"
      ONEBOARD_CI_EMBEDDING_MODEL: "all-minilm"
      ONEBOARD_LIVE_OLLAMA_TESTS: "1"
      AUTH_SECRET_KEY: "ci-only-live-api-secret-not-for-production-0123456789"
      ONEBOARD_DEMO_MODE: "false"
      ONEBOARD_PRODUCTION_MODE: "false"
      ONEBOARD_LIVE_API_DISPOSABLE: "1"
      ONEBOARD_LIVE_API_URL: "http://127.0.0.1:8000"
      CORS_ORIGINS: "http://127.0.0.1:8000"
      DATABASE_URL: "sqlite:///./oneboard_mandatory_live_ci.sqlite3"
      MODEL_PROFILES: '{"balanced":{"chat_model":"qwen2.5:0.5b","reasoning_model":"qwen2.5:0.5b","embedding_model":"all-minilm","context_size":"4096","description":"Disposable CI model profile"}}'
      OLLAMA_HOST: "127.0.0.1:11459"
      OLLAMA_BASE_URL: "http://127.0.0.1:11459"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install Python dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock'
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          export OLLAMA_NUM_PARALLEL=1
          export OLLAMA_MODELS="$RUNNER_TEMP/oneboard-models"
          ollama serve > /tmp/oneboard-ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$OLLAMA_BASE_URL/api/tags" > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/oneboard-ollama.log
          exit 1
      - name: Pull small real inference model
        run: |
          ollama pull "$ONEBOARD_CI_OLLAMA_MODEL"
          ollama pull "$ONEBOARD_CI_EMBEDDING_MODEL"
      - name: Verify downloaded model manifests and blobs
        run: |
          models="$RUNNER_TEMP/oneboard-models"
          for tag in "$ONEBOARD_CI_OLLAMA_MODEL" "$ONEBOARD_CI_EMBEDDING_MODEL"; do
            if [[ "$tag" != *:* ]]; then tag="$tag:latest"; fi
            name="${tag%:*}"
            version="${tag##*:}"
            upstream="$RUNNER_TEMP/registry-manifest.json"
            curl --fail --silent --show-error --retry 3 \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://registry.ollama.ai/v2/library/$name/manifests/$version" -o "$upstream"
            local_manifest="$models/manifests/registry.ollama.ai/library/$name/$version"
            digest=$(sha256sum "$upstream" | cut -d' ' -f1)
            size=$(wc -c < "$upstream")
            jq -e --slurpfile remote "$upstream" --arg digest "sha256:$digest" --argjson size "$size" '
              .config == $remote[0].config and
              (.layers == $remote[0].layers or
               .layers == ($remote[0].layers + [{
                 mediaType: "application/vnd.docker.distribution.manifest.v2+json",
                 digest: $digest, size: $size
               }]))
            ' "$local_manifest" > /dev/null
            local_digest=$(sha256sum "$local_manifest" | cut -d' ' -f1)
            python scripts/verify_model_artifacts.py "$local_manifest" "$models/blobs" "sha256:$local_digest"
            python scripts/verify_model_artifacts.py "$upstream" "$models/blobs" "sha256:$digest"
          done
      - name: Mandatory full Ollama suite (including smoke and genuine embeddings)
        run: |
          python scripts/require_test_suite.py 20 ollama-full.xml tests/test_ollama_integration.py -k 'not TestLiveAPIEndpoints'
          python scripts/require_test_suite.py 5 ollama-smoke.xml tests/test_ollama_live_ci.py
      - name: Evaluate real hybrid retrieval on 2048 embedded business records
        run: python -m scripts.benchmark_memory --output memory-benchmark.json
      - name: Verify provider slot release on disconnect and worker termination
        run: python -m scripts.verify_provider_cancellation
      - name: Benchmark the real model with synthetic quality and resource cases
        run: python -m scripts.benchmark_inference --model "$ONEBOARD_CI_OLLAMA_MODEL" --output model-benchmark.json
      - name: Paired real council versus single-agent recommendation evaluation
        env:
          OLLAMA_MAX_JSON_OUTPUT_TOKENS: "512"
          OLLAMA_MAX_OUTPUT_TOKENS: "256"
        run: python -m scripts.benchmark_council --output council-benchmark.json
      - name: Ten-minute real inference soak with model RSS monitoring
        env:
          ONEBOARD_CI_INFERENCE_SOAK: "1"
        run: python -m scripts.verify_inference_soak --model "$ONEBOARD_CI_OLLAMA_MODEL" --seconds 600 --output inference-soak.json
      - name: Start fresh authenticated local API and execute every live API test
        env:
          ONEBOARD_LIVE_API_TESTS: "1"
        run: |
          test ! -e oneboard_mandatory_live_ci.sqlite3
          python -m alembic upgrade head
          python -m uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/oneboard-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then break; fi
            kill -0 "$api_pid"
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health >/dev/null
          python scripts/require_test_suite.py 11 live-api.xml tests/test_ollama_integration.py::TestLiveAPIEndpoints
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mandatory-live-test-reports
          path: |
            ollama-full.xml
            ollama-smoke.xml
            memory-benchmark.json
            model-benchmark.json
            council-benchmark.json
            live-api.xml
            inference-soak.json
          retention-days: 7
      - name: Ollama diagnostics on failure
        if: failure()
        run: |
          ollama list || true
          tail -n 100 /tmp/oneboard-ollama.log || true

  postgres-security:
    name: PostgreSQL migration and shared throttle concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oneboard_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: oneboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oneboard_ci -d oneboard_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET_KEY: "ci-only-test-secret-not-for-production-0123456789abcdef"
      ONEBOARD_DEMO_MODE: "false"
      PYTHONPATH: "."
      DATABASE_URL: "postgresql+psycopg://oneboard_ci:disposable-ci-only@127.0.0.1:5432/oneboard_ci"
      ONEBOARD_TEST_POSTGRES_URL: "postgresql+psycopg://oneboard_ci:disposable-ci-only@127.0.0.1:5432/oneboard_ci"
      ONEBOARD_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock'
      - name: Verify queue scheduling, ownership and crash recovery
        env:
          ONEBOARD_QUEUE_TEST_URL: postgresql+psycopg://oneboard_ci:disposable-ci-only@127.0.0.1:5432/queue_test
          PGPASSWORD: disposable-ci-only
        run: |
          createdb -h 127.0.0.1 -U oneboard_ci queue_test
          python scripts/require_test_suite.py 2 queue.xml tests/test_inference_queue_postgres.py
      - name: Run disposable PostgreSQL migration and concurrency tests
        run: python scripts/require_test_suite.py 39 postgres-required.xml tests/integration/test_postgres_security.py
      - name: Verify full PostgreSQL 16 logical backup and restore in disposable CI
        env:
          ONEBOARD_CI_DISPOSABLE_RESTORE: "1"
          ONEBOARD_CI_ENCRYPTED_RESTORE: "1"
        run: |
          # Runner packages can omit PG16. Use the already-pulled official
          # postgres:16 service image for both dump and restore. No external
          # provider is contacted and only the disposable /tmp is mounted.
          mkdir -p "$RUNNER_TEMP/oneboard-pg16-client"
          for command in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/oneboard-pg16-client/$command" <<'WRAPPER'
          #!/bin/sh
          exec docker run -i --rm --pull never --network host --volume /tmp:/tmp --env PGPASSWORD --env PGHOST --env PGPORT --env PGUSER --env PGDATABASE --env PGSSLMODE --entrypoint "$(basename "$0")" postgres:16 "$@"
          WRAPPER
            chmod 700 "$RUNNER_TEMP/oneboard-pg16-client/$command"
          done
          export PATH="$RUNNER_TEMP/oneboard-pg16-client:$PATH"
          pg_dump --version
          pg_restore --version
          python scripts/verify_postgres_restore.py
          # Test the separately protected age encryption/decryption path on
          # disposable PostgreSQL and an ephemeral, private CI-only key.
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          python scripts/verify_encrypted_pg_restore.py
      - name: Sustained restricted-role HTTPS PostgreSQL tenant load and restart drill
        env:
          ONEBOARD_CI_HTTP_LOAD: "1"
          ONEBOARD_LOAD_SECONDS: "600"
        run: python scripts/verify_disposable_http_load.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-required-and-load
          path: |
            postgres-required.xml
            http-load-result.json
          retention-days: 7

  supply-chain:
    name: Required hashed dependencies and Git history secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tracked and reachable Git history high-confidence credential scan
        run: python scripts/check_tracked_secrets.py --history
      - name: Python dependency vulnerability audit
        run: |
          python -m venv /tmp/oneboard-audit
          /tmp/oneboard-audit/bin/python -m pip install --upgrade 'pip>=26.2.0' 'setuptools>=84.1.0'
          /tmp/oneboard-audit/bin/python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock
          python -m pip install pip-audit
          python -m pip_audit --strict --require-hashes -r apps/api/requirements.lock --format json --output pip-audit.json
      - name: Locked Node dependency vulnerability audit (high or critical fail)
        if: success() || failure()
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high --json > ../../npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            pip-audit.json
            npm-audit.json
          retention-days: 7

  infrastructure-faults:
    name: Real disposable database restart and pool exhaustion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oneboard_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: oneboard_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U oneboard_ci -d oneboard_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: "."
      DATABASE_URL: "postgresql+psycopg://oneboard_ci:disposable-ci-only@127.0.0.1:5432/oneboard_ci"
      AUTH_SECRET_KEY: "ci-only-infrastructure-fixture-not-production-0123456789"
      ONEBOARD_CI_INFRA_FAULTS: "1"
      ONEBOARD_FAULT_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements.lock
      - run: python -m alembic upgrade head
      - run: python -m scripts.verify_infra_faults
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-fault-report
          path: infra-fault-report.json

  capacity-report:
    name: Measured capacity planning report
    needs: [postgres-security, ollama-live, infrastructure-faults]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: postgres-required-and-load
          path: load
      - uses: actions/download-artifact@v4
        with:
          name: mandatory-live-test-reports
          path: inference
      - run: python -m scripts.operations.capacity_report --http-load load/http-load-result.json --inference inference/inference-soak.json --output capacity-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: measured-capacity-report
          path: capacity-report.json
