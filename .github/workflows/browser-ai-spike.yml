name: OneBoard browser inference feasibility
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/browser-ai/**'
      - '.github/workflows/browser-ai-spike.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-model-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        model:
          - { label: qwen3-0.6b, id: 'onnx-community/Qwen3-0.6B-ONNX' }
          - { label: qwen3-1.7b, id: 'onnx-community/Qwen3-1.7B-ONNX' }
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      ONEBOARD_BROWSER_AI_MODEL: ${{ matrix.model.id }}
      ONEBOARD_BROWSER_AI_DTYPE: q4
      ONEBOARD_BROWSER_AI_MAX_TOKENS: '64'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated model runtime
        working-directory: experiments/browser-ai
        run: npm install --no-audit --no-fund
      - name: Run real model on synthetic founder scenarios
        working-directory: experiments/browser-ai
        run: node benchmark.mjs
  browser-webgpu-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser probe
        working-directory: experiments/browser-ai
        run: npm install --no-audit --no-fund --no-save playwright
      - name: Install Chromium
        working-directory: experiments/browser-ai
        run: npx playwright install --with-deps chromium
      - name: Probe WebGPU in a real browser
        working-directory: experiments/browser-ai
        run: node webgpu-capability.mjs
  browser-wasm-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser model runtime and harness
        working-directory: experiments/browser-ai
        run: npm install --no-audit --no-fund --no-save vite playwright
      - name: Install Chromium
        working-directory: experiments/browser-ai
        run: npx playwright install --with-deps chromium
      - name: Run real Qwen3 model inside Chromium with CPU/WASM
        working-directory: experiments/browser-ai
        run: node browser-wasm-smoke.mjs
